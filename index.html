<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build together</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__brand">Build together<span class="nav__dot"></span></div>
    <nav class="nav__links">
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <a href="#pricing">Pricing</a>
    </nav>
    <button class="btn btn--outline">Start free trial</button>
  </header>

  <main class="hero">
    <div class="hero__copy">
      <span class="badge">Shared space for AI + humans</span>
      <h1>The best of code was almost never written by one mind</h1>
      <p class="hero__sub">
        Build Together is a shared space where you, your team, and your AI agents plan,
        build, review, and iterate — in the same room, on the same line, at the same time.
      </p>
      <button class="btn btn--primary">See it work</button>
    </div>

    <div class="hero__illustration" id="illustration">
      <div class="grid-bg"></div>
      <svg class="vines" viewBox="0 0 900 900" preserveAspectRatio="none">
        <path class="vine" d="M150,900 C150,760 230,740 210,650 C190,560 120,560 120,470" />
        <path class="vine" d="M330,900 C330,780 400,760 380,660 C360,570 300,560 300,420" />
        <path class="vine" d="M520,900 C520,770 460,740 480,640 C500,540 560,540 560,430" />
        <path class="vine" d="M700,900 C700,760 640,730 660,630 C680,540 740,540 740,380" />
        <path class="vine" d="M420,900 C440,820 500,800 470,720 C440,640 380,630 380,560" />
        <path class="vine" d="M80,900 C60,840 40,820 70,780" />
      </svg>

      <div class="flowers"></div>
      <div class="agents"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
